name: Deploy GitBook to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "gitbook/**"
      - ".github/workflows/gitbook-pages.yml"
  workflow_dispatch:

concurrency:
  group: gitbook-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gitbook
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Build static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: "/9router"

      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Self-contained deployment: this fork has no deploy key for the
      # upstream 9router.github.io repo (READ-only). Publish to THIS
      # repo's gh-pages branch with the built-in token instead — site
      # serves at https://vibecoder11200.github.io/9router/.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gitbook/out
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
